[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "package_name"
version = "0.1.0"
description = "A short description of the project."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build",
]

[project.urls]
Homepage = "https://github.com/{GITHUB_ACCOUNT}/{REPO_NAME}"
Repository = "https://github.com/{GITHUB_ACCOUNT}/{REPO_NAME}"
Issues = "https://github.com/{GITHUB_ACCOUNT}/{REPO_NAME}/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"package_name" = ["resources/**"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["package_name"]

[tool.coverage.report]
show_missing = true
